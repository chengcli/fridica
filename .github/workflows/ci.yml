name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux confinement test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow bubblewrap user namespaces (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        # Same profile as the README's Linux sandbox setup; it applies to bwrap only.
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
              '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --ro-bind / / -- /bin/true
      - name: Formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --test-threads=2

  native-candidate:
    name: Native candidate packaging (Linux x86_64)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify archive failures and stopped-state snapshots
        run: python -m unittest discover -s tests -p test_candidate_packaging.py -v
      - name: Reproduce native candidate and test a disposable installation
        run: python scripts/package_candidate.py --verify-reproducible --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate-linux-x86_64
          path: dist/candidate/*
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          node --test tests/dashboard.test.cjs

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Same manylinux build as release.yml; the full platform matrix runs only on release.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: '2_28'
          args: --release --locked --out dist
      - name: Build sdist and check distributions
        run: |
          python -m pip install "maturin>=1.7,<2" "twine>=5"
          maturin sdist --out dist
          python -m twine check dist/*
      - name: Smoke test installed wheel
        run: scripts/smoke_wheel.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          path: dist/*
          if-no-files-found: error
