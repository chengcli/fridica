name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Linux confinement and credential-store prerequisites
        if: runner.os == 'Linux'
        run: scripts/setup_ci_bubblewrap.sh gnome-keyring dbus-daemon
      - uses: taiki-e/install-action@nextest
      - name: Formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked --all-targets --profile ci
          cargo test --locked --doc
      - name: Exercise the native Linux credential store
        if: runner.os == 'Linux'
        run: |
          XDG_DATA_HOME="$(mktemp -d)"
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_DATA_HOME XDG_RUNTIME_DIR
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "temporary-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --test configuration native_store_round_trip -- --ignored
          '

  native-candidate:
    name: Native candidate packaging (Linux x86_64)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify archive failures and stopped-state snapshots
        run: python -m unittest discover -s tests -p test_candidate_packaging.py -v
      - name: Reproduce native candidate and test a disposable installation
        run: python scripts/package_candidate.py --verify-reproducible --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate-linux-x86_64
          path: dist/candidate/*
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          node --test tests/dashboard*.cjs

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: ci-distributions
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: ci-distributions-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Linux confinement for the installed wheel
        run: scripts/setup_ci_bubblewrap.sh
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          manylinux: '2_28'
          args: --release --locked --out dist
      - name: Build sdist and check distributions
        run: |
          python -m pip install "maturin>=1.7,<2" "twine>=5"
          maturin sdist --out dist
          python -m twine check dist/*
      - name: Smoke test installed wheel
        run: scripts/smoke_wheel.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
