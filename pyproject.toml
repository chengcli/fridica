[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fridica"
# Stamped from the release tag by `scripts/release.py stamp` before wheels are built.
version = "0.4.0.dev0"
description = "Your Slack presence: a parent agent per person, a session per thread, and Claude Code / Codex workers on your machines"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

[tool.maturin]
# The wheel carries the native `fridica` and `fridica-overseer` executables only; it
# links no Python ABI, so one py3-none-<platform> wheel serves every Python version.
bindings = "bin"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "tests"]

[tool.ruff]
# The pre-commit hook lints with ruff's default rules only (pyflakes and the
# pycodestyle error subset); line length and formatting are not enforced.
line-length = 340
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Several compact modules put short statements on one line on purpose.
ignore = ["E701", "E702"]
