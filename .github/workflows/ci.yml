name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Formatting, layering, migrations and replay
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python scripts/verify_baseline.py
          PYTHONPATH=spec python scripts/capture_gates.py
          python -m pip install "aiohttp>=3.10,<4" "slack-sdk>=3.33,<4"
          PYTHONPATH=spec python scripts/capture_outbox.py
          PYTHONPATH=spec python scripts/capture_config.py
          PYTHONPATH=spec python scripts/capture_placement.py
          PYTHONPATH=spec python scripts/capture_supervisor.py
          PYTHONPATH=spec python scripts/capture_transport.py
          PYTHONPATH=spec python scripts/capture_workers.py
          PYTHONPATH=spec python scripts/capture_approval_instructions.py
          PYTHONPATH=spec python scripts/capture_fetch.py
          PYTHONPATH=spec python scripts/capture_flow.py
          PYTHONPATH=spec python scripts/capture_parent.py
          PYTHONPATH=spec python scripts/capture_slack.py
          git diff --exit-code -- tests/corpus/

  test:
    name: Test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          node --test tests/dashboard.test.cjs

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          fridica --help
          python -m fridica --version
          python -c 'from importlib.resources import files; import fridica; from importlib.metadata import version; assert fridica.__version__ == version("fridica"); assert files("fridica").joinpath("manifest.yaml").is_file()'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
