<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f5">
  <title>Fridica · Control room</title>
  <link rel="icon" href="fridica-logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <div class="main-column">
      <header class="topbar">
        <div class="brand"><img src="fridica-logo.png" alt=""><div><strong>fridica</strong><small>CONTROL ROOM</small></div></div>
        <nav id="tabs" aria-label="Main navigation">
          <button data-view="overview" class="active">Work</button>
          <button data-view="inbox">Needs you <span id="inbox-count" class="count"></span></button>
          <button data-view="threads">Conversations</button>
          <button data-view="machines">Machines &amp; access</button>
          <button id="settings-tab" data-view="settings">Settings</button>
        </nav>
        <div class="top-actions"><span id="status" class="connection">Connecting</span><span id="last-sync" class="last-sync"></span>
          <button id="refresh-button" class="icon-button" title="Refresh now" aria-label="Refresh now">↻</button>
          <button id="auto-button" class="text-button" aria-pressed="true">Live on</button></div>
      </header>
      <span id="current-view" class="sr-only">Work</span>
      <main>
        <section id="unlock" class="unlock panel" hidden>
          <div class="eyebrow">LOCAL ACCESS</div><h2>Unlock the control room</h2>
          <p>Enter the key printed by <code>fridica dashboard</code>.</p>
          <form id="unlock-form"><input id="key" type="password" autocomplete="off" aria-label="Dashboard key" required><button class="primary">Unlock</button></form>
        </section>
        <section id="view"></section>
      </main>
    </div>
  </div>
  <dialog id="confirm-dialog"><form method="dialog"><div class="eyebrow">REVIEW ACTION</div><h2 id="dialog-title"></h2><p id="dialog-body"></p><pre id="dialog-detail" hidden></pre><div class="dialog-actions"><button value="cancel">Cancel</button><button id="dialog-confirm" value="confirm" class="primary">Continue</button></div></form></dialog>
  <dialog id="worker-dialog" class="worker-dialog"><div class="worker-dialog-top"><button id="worker-close" class="button" autofocus>Close</button></div><div id="worker-detail"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
