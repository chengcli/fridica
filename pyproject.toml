[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fridica"
dynamic = ["version"]
description = "A local personal agent connecting Slack to Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["slack-sdk>=3.33,<4", "aiohttp>=3.10,<4", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "hatchling>=1.25", "hatch-vcs>=0.4", "twine>=5"]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'

[tool.hatch.version.raw-options]
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[project.scripts]
fridica = "fridica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fridica"]

[tool.hatch.build.targets.wheel.force-include]
"slack/manifest.yaml" = "fridica/manifest.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
