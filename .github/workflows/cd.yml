name: Auto Tag on PR Merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag-main
  cancel-in-progress: false
  queue: max

jobs:
  create-tag:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default checkout is the trusted base branch. Checking out the
      # pull request's merge commit by ref is refused for a fork's pull
      # request (actions/checkout 5.1+, allow-unsafe-pr-checkout), so the
      # merged commit is reached from main, once verified to be on it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the merged commit, verified to be on main
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          git checkout --quiet --detach "$MERGE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine release tag
        id: version
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: python scripts/release.py next >> "$GITHUB_OUTPUT"
      - name: Push tag for the merged commit
        if: steps.version.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Release $RELEASE_TAG" --generate-notes
          fi
