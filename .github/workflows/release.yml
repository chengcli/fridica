name: Publish to PyPI

# Modeled on snapy's release workflow: build per-OS wheels from an existing tag,
# collect every `wheels-*` artifact into dist/, verify, then publish. Fridica's
# wheels carry native executables with no Python ABI, so each platform needs one
# py3-none-<platform> wheel rather than one wheel per Python version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.1
        type: string
        required: true
      build_os:
        description: Operating systems to build and publish
        type: choice
        required: true
        default: Both
        options:
          - Both
          - MacOS
          - Ubuntu

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve a release tag on main
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate-tag.outputs.sha }}

  build-linux:
    name: Build Linux wheel (${{ matrix.arch }})
    needs: validate-tag
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'Ubuntu' }}
    # Native runners per architecture so every wheel is also smoke-tested.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release.py stamp --tag "$RELEASE_TAG"
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          manylinux: '2_28'
          args: --release --locked --out wheelhouse
      - name: Smoke test installed wheel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: scripts/smoke_wheel.sh wheelhouse/*.whl "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-macos:
    name: Build macOS wheel (${{ matrix.arch }})
    needs: validate-tag
    if: ${{ inputs.build_os == 'Both' || inputs.build_os == 'MacOS' }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            deployment: '11.0'
          - arch: x86_64
            target: x86_64-apple-darwin
            deployment: '10.13'
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release.py stamp --tag "$RELEASE_TAG"
      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --release --locked --target ${{ matrix.target }} --out wheelhouse
      - name: Smoke test installed wheel
        # The runner is arm64; the Intel wheel is cross-built and checked by release.py verify.
        if: ${{ matrix.arch == 'arm64' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: scripts/smoke_wheel.sh wheelhouse/*.whl "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release.py stamp --tag "$RELEASE_TAG"
      - name: Build sdist
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin sdist --out wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: wheelhouse/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [validate-tag, ci, build-linux, build-macos, sdist]
    # Skipped OS builds are allowed only when that OS was not selected.
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' && needs.sdist.result == 'success' &&
      (needs.build-linux.result == 'success' || inputs.build_os == 'MacOS') &&
      (needs.build-macos.result == 'success' || inputs.build_os == 'Ubuntu') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/fridica/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect wheels and sdist into dist/
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_OS: ${{ inputs.build_os }}
        run: |
          python -m pip install "twine>=5"
          python -m twine check dist/*
          python scripts/release.py verify --tag "$RELEASE_TAG" --os "$BUILD_OS"
      - name: Publish wheels and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
