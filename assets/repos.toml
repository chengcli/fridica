# Shared repository list, distributed with Fridica.
#
# This file is the same for everyone running Fridica: it ships inside the package
# and every agent run reads it. To add, remove, or change an entry, open a pull
# request against main that edits this file; the test suite validates it on every
# pull request. Do not keep a private copy beside config.toml: entries added
# there would be invisible to the rest of the team.
#
# Entries never name a local checkout location. Each person keeps their clones
# wherever they like; the agent finds the checkout for a chosen repository under
# its configured workspace roots by matching the git remote URL.
#
# Fields per [[repos]] entry:
#   name          the name people use in conversation (required, unique)
#   url           GitHub URL of the repository (required)
#   collaborators the people who work on it, as plain names or Slack member IDs (U…);
#                 the FIRST entry is the repository owner, whose decisions about the
#                 repository are final (required, at least the owner)
#   notes         one line that helps tell similar entries apart (optional)

