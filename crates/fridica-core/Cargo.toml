[package]
name = "fridica-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fridica's domain: threads, parent decisions and delegation, workers, machines and placement, delivery outcomes and attention policy"
license = "MIT"
repository = "https://github.com/chengcli/fridica"
readme = "README.md"
keywords = ["agent", "slack", "orchestration"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
